<!DOCTYPE html>

	<body>

    <script>
      async function readClipboard() {
      	var clipboard = await navigator.clipboard.readText();
        console.log(clipboard);
        await navigator.clipboard.writeText('{"first": "1", "second": "2", "third": "3"}');
        var newClipboard = await navigator.clipboard.readText();
        console.log(newClipboard);
      }
      
    </script>
  </body>
